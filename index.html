<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bombastic Studio</title>
  <meta name="description" content="Bombastic Studio — handcrafted goods. Coming soon." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f1ea;
      --text: #2b2118;
      --muted: #6b5a4a;
      --accent: #8a5a2b;
      --pad: clamp(16px, 5vw, 40px);
    }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    header {
      position: relative;
      padding: 20px var(--pad);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      text-decoration: none;
      color: inherit;
    }

    nav { display: flex; gap: 28px; }
    nav a {
      color: inherit;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover { text-decoration: underline; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      width: 32px;
      height: 32px;
      position: relative;
    }
    .menu-toggle span,
    .menu-toggle span::before,
    .menu-toggle span::after {
      content: "";
      position: absolute;
      left: 4px;
      width: 24px;
      height: 2px;
      background: var(--text);
      transition: transform 0.25s, opacity 0.25s;
    }
    .menu-toggle span { top: 15px; }
    .menu-toggle span::before { top: -7px; left: 0; }
    .menu-toggle span::after  { top: 7px;  left: 0; }

    .menu-toggle.open span { background: transparent; }
    .menu-toggle.open span::before { transform: translateY(7px) rotate(45deg); }
    .menu-toggle.open span::after  { transform: translateY(-7px) rotate(-45deg); }

    /* ---------- Hero ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px var(--pad) 60px;
    }

    h1 {
      font-size: clamp(2.6rem, 11vw, 6rem);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .tagline {
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 32px;
      max-width: 500px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover { background: var(--accent); transform: translateY(-2px); }

    form {
      margin-top: 28px;
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 420px;
    }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 13px 18px;
      border: 1px solid #c9b8a5;
      border-radius: 999px;
      font-size: 1rem; /* 16px stops iOS from zooming in */
      background: #fff;
    }
    form button {
      padding: 13px 24px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      padding: 24px var(--pad);
      font-size: 0.85rem;
      color: #8c7b6a;
    }

    /* ---------- Tablet & below ---------- */
    @media (max-width: 768px) {
      .menu-toggle { display: block; }

      nav {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: var(--bg);
        border-top: 1px solid #e3d8cb;
        border-bottom: 1px solid #e3d8cb;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        z-index: 10;
      }
      nav.open { max-height: 300px; }
      nav a {
        padding: 16px var(--pad);
        font-size: 1.05rem;
        border-bottom: 1px solid #eee4d8;
      }
      nav a:last-child { border-bottom: none; }
    }

    /* ---------- Small phones ---------- */
    @media (max-width: 480px) {
      form { flex-direction: column; }
      form button, .btn { width: 100%; }
      .btn { max-width: 420px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">Bombastic Studio</a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
    </button>
    <nav id="nav">
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="mailto:hello@bombasticstudio.com">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Bombastic<br />Studio</h1>
    <p class="tagline">Handcrafted pieces, made with care. Our shop is opening soon.</p>
    <a href="#" class="btn">Coming Soon</a>

    <form onsubmit="event.preventDefault(); alert('Thanks! We\'ll keep you posted.'); this.reset();">
      <input type="email" placeholder="Your email" required />
      <button type="submit">Notify Me</button>
    </form>
  </main>

  <footer>
    &copy; <span id="year"></span> Bombastic Studio. All rights reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const toggle = document.querySelector(".menu-toggle");
    const nav = document.getElementById("nav");
    toggle.addEventListener("click", () => {
      const isOpen = nav.classList.toggle("open");
      toggle.classList.toggle("open", isOpen);
      toggle.setAttribute("aria-expanded", isOpen);
    });
  </script>
</body>
</html>
